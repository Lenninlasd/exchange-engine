# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Deploy

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy NodeJS app
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{secrets.SSH_HOST}} # IP address of the server you wish to ssh into
          key: ${{secrets.SSH_KEY}} # Private or public key of the server
          username: ${{ secrets.SSH_USERNAME }} # User of the server you want to ssh into
          script: |
            if [[ "$(docker ps -q -f name=engine)" ]]; then
              echo "Stopping and removing the existing engine container..."
              docker stop engine
              docker rm engine
            else
              echo "No running engine container found."
            fi

            docker run -d \
              --name engine \
              --network docker-zener_mynetwork \
              -p 8080:8080 \
              -e AUTH0_DOMAIN=${{ vars.AUTH0_DOMAIN }} \
              -e AUTH0_AUDIENCE=${{ vars.AUTH0_AUDIENCE }} \
              -e WOMPI_INTEGRITY=${{ secrets.WOMPI_INTEGRITY }} \
              -e WOMPI_EVENT=${{ secrets.WOMPI_EVENT }} \
              -e OPENEXCHANGE_APP_ID=${{ secrets.OPENEXCHANGE_APP_ID }} \
              --health-cmd='pg_isready -h postgres' --health-interval=10s --health-retries=5 --health-start-period=30s \
              registry.digitalocean.com/zener/engine:v0.0.12-rc3
