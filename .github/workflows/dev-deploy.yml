# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Build and Push Image

on:
  push:
    branches: [ "main", "ZENER-77" ]

jobs:

  build:
    runs-on: ubuntu-latest
    env:
      SHA_COMMIT: ${{ github.sha }}
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.18

    - name: Test
      run: go test -v ./...

    - name: Install doctl
      uses: digitalocean/action-doctl@v2
      with:
        token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

    - name: Login to Docker
      run: doctl registry login --expiry-seconds 240

    - name: Build Image
      run: docker build . -t registry.digitalocean.com/zener/engine:dev-${{ SHA_COMMIT }}

    - name: Push Image
      run: docker push registry.digitalocean.com/zener/engine:dev-${{ SHA_COMMIT }}
    - name: Print branch name
      run: |
        echo "Branch sha: ${{ github.sha }}"
    

