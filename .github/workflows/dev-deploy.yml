# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Build and Push Image

on:
  push:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.18

    - name: Test
      run: go test -v ./...

    - name: Install doctl
      uses: digitalocean/action-doctl@v2
      with:
        token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

    - name: Login to Docker
      run: doctl registry login --expiry-seconds 90

    - name: Build Image
      run: docker build . -t registry.digitalocean.com/zener/engine:dev

    - name: Push Image
      run: docker push registry.digitalocean.com/zener/engine:dev

  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v3

      - name: Deploy Engine
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{secrets.SSH_HOST}}
          key: ${{secrets.SSH_KEY}}
          username: ${{ secrets.SSH_USERNAME }}
          script: |
            docker pull registry.digitalocean.com/zener/engine:dev

            if [ "$(docker ps -aq -f name=engine)" ]; then
              echo "Stopping and removing the existing engine container..."
              docker stop engine
              docker rm engine
            else
              echo "No running engine container found."
            fi

            docker run -d \
              --name engine \
              --network zener_mynetwork \
              -p 8080:8080 \
              -e POSTGRES_HOST=${{ env.POSTGRES_HOST }} \
              -e POSTGRES_PORT=${{ env.POSTGRES_PORT }} \
              -e POSTGRES_PASS=${{ secrets.TEST_POSTGRES_PASS }} \
              -e OPENEXCHANGE_APP_ID=${{ secrets.OPENEXCHANGE_APP_ID }} \
              -e WOMPI_INTEGRITY=${{ secrets.TEST_WOMPI_INTEGRITY }} \
              -e WOMPI_EVENT=${{ secrets.TEST_WOMPI_EVENT }} \
              -e WITHDRAWAL_INTEGRITY=${{ secrets.TEST_WITHDRAWAL_INTEGRITY }} \
              -e JWT_SECRET=${{ secrets.TEST_SUPABASE_JWT_SECRET }} \
              -e WALLET_ADDRESS=http://wallet:8000 \
              -e ALERT_BOT_TOKEN=${{ secrets.ALERT_BOT_TOKEN }} \
              -e TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }} \
              registry.digitalocean.com/zener/engine:dev

