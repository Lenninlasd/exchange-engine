# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Build and Push Image

on:
  release:
    types: [published]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.18

    - name: Test
      run: go test -v ./...

    - name: Install doctl
      uses: digitalocean/action-doctl@v2
      with:
        token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

    - name: Login to Docker
      run: doctl registry login --expiry-seconds 90

    - name: Build Image
      run: docker build . -t registry.digitalocean.com/zener/engine:${{ github.event.release.tag_name }}

    - name: Push Image
      run: docker push registry.digitalocean.com/zener/engine:${{ github.event.release.tag_name }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      TAG_NAME: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v3

      - name: Deploy Engine
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{secrets.SSH_HOST}}
          key: ${{secrets.SSH_KEY}}
          username: ${{ secrets.SSH_USERNAME }}
          script: |
            docker pull registry.digitalocean.com/zener/engine:${{ env.TAG_NAME }}

            if [ "$(docker ps -aq -f name=engine)" ]; then
              echo "Stopping and removing the existing engine container..."
              docker stop engine
              docker rm engine
            else
              echo "No running engine container found."
            fi

            docker run -d \
              --name engine \
              --network zener_mynetwork \
              -p 8080:8080 \
              -e AUTH0_DOMAIN=${{ vars.AUTH0_DOMAIN }} \
              -e AUTH0_AUDIENCE=${{ vars.AUTH0_AUDIENCE }} \
              -e WOMPI_INTEGRITY=${{ secrets.WOMPI_INTEGRITY }} \
              -e WOMPI_EVENT=${{ secrets.WOMPI_EVENT }} \
              -e OPENEXCHANGE_APP_ID=${{ secrets.OPENEXCHANGE_APP_ID }} \
              -e WITHDRAWAL_INTEGRITY=${{ secrets.WITHDRAWAL_INTEGRITY }} \
              registry.digitalocean.com/zener/engine:${{ env.TAG_NAME }}

