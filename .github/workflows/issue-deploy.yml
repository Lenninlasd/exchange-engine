name: Issue-based Dev/Prod existent image deploy 

on:
  issues:
    types: 
      - opened
      - edited
      
  issue_comment:
     types: 
       - created
jobs:
  extract-context:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.extract_variables.outputs.environment }}
      tag_img: ${{ steps.extract_variables.outputs.tag_img }}
    steps:
      - name: Extract variables
        id: extract_variables
        run: |
          
          # Extracting variables from issue or comment body
          ISSUE_BODY="${{ github.event.issue.body }}"

          if [ "${{ github.event_name }}" == "issue_comment" ]; then
            ISSUE_BODY="${{ github.event.issue_comment.body }}"
          fi

          ENV=$(echo "$ISSUE_BODY" | grep -o -- '--env [^ ]*' | cut -d' ' -f2)
          TAG=$(echo "$ISSUE_BODY" | grep -o -- '--tag [^ ]*' | cut -d' ' -f2)

          echo "environment=${ENV}" >> "$GITHUB_OUTPUT"
          echo "tag_img=${TAG}" >> "$GITHUB_OUTPUT"
          
          if [ "${ENV}" == "dev" ]; then
            echo "tag_img=dev-${TAG}" >> "$GITHUB_OUTPUT"
          fi
          echo "env: $environment"
          echo "tag_img: $tag_img"
  build:
    # Not sure if we should build an image if we will select an existent one.
    runs-on: ubuntu-latest
    needs: [extract-context]
    uses:
      - uses: actions/checkout@v3
    steps:
      - env:
          ENV: ${{needs.extract-context.outputs.environment}}
          TAG: ${{needs.extract-context.outputs.tag_img}}
        name: Build selected image
        run: |
          echo "$ENV $TAG"

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.18

      - name: Test
        run: go test -v ./...     

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Login to Docker
        run: doctl registry login --expiry-seconds 240

      - name: Build Image
        run: docker build . -t registry.digitalocean.com/zener/engine:${{ env.TAG }}

      - name: Push Image
        run: docker push registry.digitalocean.com/zener/engine:${{ env.TAG }}

  deploy-prod:
    # TODO: create a reusable workflow for prod builds.
      runs-on: ubuntu-latest
      needs: [extract-context]
      if: needs.extract-context.outputs.environment == "prod"
      env:
        TAG_NAME: ${{ github.event.release.tag_name }}
        ENGINE_PORT: ":8282"
        POSTGRES_HOST: "postgres_prod"
        POSTGRES_PORT: "5432"
        ENV: ${{needs.extract-context.outputs.environment}}
        TAG: ${{needs.extract-context.outputs.tag_img}}
      steps:
        - uses: actions/checkout@v3

        - name: Deploy Engine
          uses: appleboy/ssh-action@v0.1.10
          with:
            host: ${{secrets.SSH_HOST}}
            key: ${{secrets.SSH_KEY}}
            username: ${{ secrets.SSH_USERNAME }}
            script: |
              docker pull registry.digitalocean.com/zener/engine:${{ env.TAG }}

              if [ "$(docker ps -aq --filter 'name=^/engine_prod$')" ]; then
                echo "Stopping and removing the existing engine_prod container..."
                docker stop engine_prod
                docker rm engine_prod
              else
                echo "No running engine container found."
              fi

              docker run -d \
                --name engine_prod \
                --network zener_mynetwork \
                -p 8282:8282 \
                -e ENGINE_PORT=${{ env.ENGINE_PORT }} \
                -e POSTGRES_HOST=${{ env.POSTGRES_HOST }} \
                -e POSTGRES_PORT=${{ env.POSTGRES_PORT }} \
                -e POSTGRES_PASS=${{ secrets.POSTGRES_PASS }} \
                -e OPENEXCHANGE_APP_ID=${{ secrets.OPENEXCHANGE_APP_ID }} \
                -e WOMPI_INTEGRITY=${{ secrets.WOMPI_INTEGRITY }} \
                -e WOMPI_EVENT=${{ secrets.WOMPI_EVENT }} \
                -e WITHDRAWAL_INTEGRITY=${{ secrets.WITHDRAWAL_INTEGRITY }} \
                -e JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }} \
                -e WALLET_ADDRESS=http://wallet_prod:8000 \
                -e ALERT_BOT_TOKEN=${{ secrets.ALERT_BOT_TOKEN }} \
                -e TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }} \
                -e SUPA_SERVICE_ROLE_TOKEN=${{ secrets.SUPA_SERVICE_ROLE_TOKEN }} \
                -e SUPA_PROJECT_ID=${{ vars.SUPA_PROJECT_ID }} \
                -e BITCOIN_NETWORK=Mainnet \
                registry.digitalocean.com/zener/engine:${{ env.TAG }}

  deploy-dev:
    # TODO: create a reusable workflow for dev builds.
    runs-on: ubuntu-latest
    needs: [extract-context]
    if: needs.extract-context.outputs.environment == "dev"
    env:
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      ENV: ${{needs.extract-context.outputs.environment}}
      TAG: ${{needs.extract-context.outputs.tag_img}}
    steps:
      - uses: actions/checkout@v3

      - name: Deploy Engine
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{secrets.SSH_HOST}}
          key: ${{secrets.SSH_KEY}}
          username: ${{ secrets.SSH_USERNAME }}
          script: |
            docker pull registry.digitalocean.com/zener/engine:${{ env.TAG }}

            if [ "$(docker ps -aq --filter 'name=^/engine$')" ]; then
              echo "Stopping and removing the existing engine container..."
              docker stop engine
              docker rm engine
            else
              echo "No running engine container found."
            fi

            docker run -d \
              --name engine \
              --network zener_mynetwork \
              -p 8080:8080 \
              -e POSTGRES_HOST=${{ env.POSTGRES_HOST }} \
              -e POSTGRES_PORT=${{ env.POSTGRES_PORT }} \
              -e POSTGRES_PASS=${{ secrets.TEST_POSTGRES_PASS }} \
              -e OPENEXCHANGE_APP_ID=${{ secrets.OPENEXCHANGE_APP_ID }} \
              -e WOMPI_INTEGRITY=${{ secrets.TEST_WOMPI_INTEGRITY }} \
              -e WOMPI_EVENT=${{ secrets.TEST_WOMPI_EVENT }} \
              -e WITHDRAWAL_INTEGRITY=${{ secrets.TEST_WITHDRAWAL_INTEGRITY }} \
              -e JWT_SECRET=${{ secrets.TEST_SUPABASE_JWT_SECRET }} \
              -e WALLET_ADDRESS=http://wallet:8000 \
              -e ALERT_BOT_TOKEN=${{ secrets.ALERT_BOT_TOKEN }} \
              -e TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }} \
              -e SUPA_SERVICE_ROLE_TOKEN=${{ secrets.TEST_SUPA_SERVICE_ROLE_TOKEN }} \
              -e SUPA_PROJECT_ID=${{ vars.TEST_SUPA_PROJECT_ID }} \
              -e BITCOIN_NETWORK=Testnet \
              registry.digitalocean.com/zener/engine:${{ env.TAG }}